[package]
name = "portwho"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
libc = "0.2.190"
listeners = "0.6.1"
ratatui = "0.30.2"
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
